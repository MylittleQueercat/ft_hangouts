// This file sets the Android app ID, SDK levels, and Java version.
apply plugin: 'com.android.application'

android {
    namespace 'com.hguo.fthangouts'
    compileSdk 37

    defaultConfig {
        applicationId 'com.hguo.fthangouts'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
